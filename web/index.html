<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reyaansh's Things">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Reyaansh's Things">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Reyaansh's Things Web</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #f7f3ff;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: #f7f3ff;
    }

    #flutter-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, #eaddff 0, transparent 42%),
        radial-gradient(ellipse at 82% 84%, #d8e2ff 0, transparent 44%),
        #f7f3ff;
      color: #1d192b;
      opacity: 1;
      transition: opacity 420ms ease;
    }

    #flutter-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      display: grid;
      justify-items: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      animation: splash-arrive 700ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .splash-animation {
      display: grid;
      position: relative;
      width: 128px;
      height: 128px;
      place-items: center;
    }

    #lottie-animation {
      position: absolute;
      inset: 0;
    }

    .splash-logo {
      z-index: 1;
      width: 60px;
      height: 60px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(66, 45, 122, .2);
    }

    .splash-title {
      margin: 0;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .splash-caption {
      margin: 0;
      color: #625b71;
      font-size: 14px;
    }

    .splash-progress {
      width: min(240px, 70vw);
      height: 6px;
      margin-top: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(103, 80, 164, .16);
    }

    .splash-progress span {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6750a4, #9a82d2);
      animation: splash-progress 1.35s cubic-bezier(.65, 0, .35, 1) infinite;
    }

    @keyframes splash-arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes splash-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(280%); }
    }

    @media (prefers-color-scheme: dark) {
      :root, body { background: #141218; }
      #flutter-splash {
        background:
          radial-gradient(ellipse at 18% 18%, #33284a 0, transparent 42%),
          radial-gradient(ellipse at 82% 84%, #222b42 0, transparent 44%),
          #141218;
        color: #f4effa;
      }
      .splash-caption { color: #cbc3d8; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="flutter-splash" role="status" aria-live="polite">
    <div class="splash-content">
      <div class="splash-animation" aria-hidden="true">
        <div id="lottie-animation"></div>
        <img class="splash-logo" src="favicon.png" alt="">
      </div>
      <h1 class="splash-title">Reyaansh's Things Web</h1>
      <p class="splash-caption">Loading...</p>
      <div
        class="splash-progress"
        role="progressbar"
        aria-label="Loading application"
        aria-valuetext="Loading"
      >
        <span></span>
      </div>
    </div>
  </div>
  <script>
    const splashAnimationUrl = new URL('splash.json', document.baseURI);

    fetch(splashAnimationUrl)
      .then((response) => {
        if (response.status === 404) return null;
        if (!response.ok) {
          throw new Error(`Lottie file request failed: ${response.status}`);
        }
        return response.json();
      })
      .then((animationData) => {
        if (!animationData) return;

        const lottieScript = document.createElement('script');
        lottieScript.src =
          'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js';
        lottieScript.onload = () => {
          if (!window.lottie) {
            console.warn('Lottie player did not initialize; using the static logo.');
            return;
          }
          window.lottie.loadAnimation({
              container: document.getElementById('lottie-animation'),
              renderer: 'svg',
              loop: true,
              autoplay: true,
              animationData,
            });
        };
        lottieScript.onerror = () => {
          console.warn('Could not load Lottie player; using the splash fallback.');
        };
        document.head.appendChild(lottieScript);
      })
      .catch((error) => {
        console.warn('Could not load splash.json; using the splash fallback.', error);
      });

    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('flutter-splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      splash.addEventListener('transitionend', () => splash.remove(), {
        once: true,
      });
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
