name: Build and publish Android release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"]+)['\"]?.*/\1/p" pubspec.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read the app version from pubspec.yaml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk_name=Reyaanshs-Things-Android-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"

      - name: Build signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret."
              exit 1
            fi
          done
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/$APK_NAME"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Reyaansh's Things Android ${{ steps.version.outputs.version }}"
          body: |
            ## Install on Android

            1. Download the attached `${{ steps.version.outputs.apk_name }}` file.
            2. Open it on your Android device.
            3. If prompted, allow your browser or file manager to install unknown apps.
            4. Tap **Install**.
          files: ${{ runner.temp }}/${{ steps.version.outputs.apk_name }}
          fail_on_unmatched_files: true

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
